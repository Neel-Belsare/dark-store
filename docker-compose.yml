version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Streamlit Command Center (app.py)
  # ----------------------------------------------------------------------------
  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dark-store-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - FASTAPI_BACKEND_URL=http://api-backend:8000
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./latest_order.json:/app/latest_order.json
      - ./order_history.json:/app/order_history.json
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api-backend

  # ----------------------------------------------------------------------------
  # FastAPI Routing & Dispatch Engine (api.py)
  # ----------------------------------------------------------------------------
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dark-store-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./latest_order.json:/app/latest_order.json
      - ./order_history.json:/app/order_history.json
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
