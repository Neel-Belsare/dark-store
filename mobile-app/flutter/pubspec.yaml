name: blinkit_clone
description: "Quick-Commerce Blinkit Clone & Autonomous Dispatch App (v4.0.0)"
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Utilities
  provider: ^6.1.2
  http: ^1.2.1
  intl: ^0.19.0

  # Supabase Cloud Integration
  supabase_flutter: ^2.8.0

  # Map & Geospatial
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # UI & Animations
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
